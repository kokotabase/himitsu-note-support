<h1>交換してはじめてわかる、ふたりだけの共通点。</h1>
<p>ひみつノートは、プロフィールカードを QR コードで交換して、相手との共通の趣味を見つける iPhone アプリです。趣味ごとに「公開」「共通なら表示」「非公開」を選べるので、ちょっと人に言いにくい趣味も、同じ趣味の相手にだけそっと見せられます。</p>
